<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الخطط الذكية — عرض تعريفي</title>
<meta name="theme-color" content="#0f8a94">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f5fafb;--surface:#ffffff;--soft:#eef8fa;--ink:#0d2b45;--ink2:#3d566b;--muted:#71859a;--line:#e2edf1;--brand:#0f8a94;--brand2:#0c6f82;--brandsoft:#e3f6f7;--ok:#1f9d63;--bad:#d23f4f;--acc:#f0a530;--acc2:#d98e12;--gold:#ffd98a;
--grad:linear-gradient(135deg,#18a4ab,#0c6f82);--hv:linear-gradient(135deg,#0b5f73 0%,#0f8a94 52%,#2bb3b8 100%);--shadow:0 6px 20px rgba(13,59,102,.07);
--lab-navy:#102c3b;--lab-teal:#39a6a3;--lab-blue:#3f7592;--lab-orange:#f0a530;--font:"Tajawal","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a2f3a;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 30% 20%,#0f4b58,#071f28 70%)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;border-radius:6px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.45)}
.slide{position:absolute;inset:0;background:var(--bg);opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s;display:flex;flex-direction:column;padding:96px 88px 84px}
.slide.on{opacity:1;visibility:visible}
/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.rv.z{transform:scale(.88)}.rv.l{transform:translateX(-30px)}.rv.r{transform:translateX(30px)}
.slide.on .rv:not(.st),.slide.on .st.in{opacity:1;transform:none}
.st{transition-delay:0s}
.hint{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;background:rgba(8,32,42,.78);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:8px 18px;font-size:15px;transition:opacity .4s;pointer-events:none}
.hint.off{opacity:0}
#steps{display:flex;gap:4px;align-items:center;padding:0 4px}#steps i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}#steps i.on{background:#ffd98a}
/* chrome on light slides */
.top{position:absolute;top:0;left:0;right:0;height:72px;display:flex;align-items:center;gap:14px;padding:0 88px;background:var(--surface);border-bottom:1px solid var(--line)}
.bm{display:flex;align-items:center;gap:10px}.bm svg{width:38px;height:38px}
.bm b{display:block;font-size:19px;font-weight:800}.bm small{display:block;font-size:13px;color:var(--muted)}
.top .sp{flex:1}
.moe{display:flex;flex-direction:column;align-items:center;line-height:1.2;padding-inline-start:12px;border-inline-start:2px solid var(--brand)}.moe b{font-size:16px}.moe small{font-size:11px;color:var(--muted)}
.foot{position:absolute;bottom:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 88px;font-size:15px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface)}
.foot .pg{direction:ltr;font-weight:800;color:var(--brand2);font-variant-numeric:tabular-nums}
/* section header */
.sh{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.sh>span{flex:none;width:72px;height:72px;border-radius:22px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:28px;box-shadow:0 10px 24px rgba(12,111,130,.28)}
.kick{display:inline-block;font-size:15px;font-weight:700;color:var(--acc2);background:#fdf3e2;border-radius:99px;padding:3px 14px;margin-bottom:6px}
.sh h2{font-size:48px;font-weight:800;line-height:1.15}
.sh p{font-size:21px;color:var(--muted);margin-top:4px}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.ib{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--brandsoft);color:var(--brand);font-size:28px;flex:none}
/* hero slides */
.hero{background:var(--hv);color:#fff;padding:80px 100px}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}
.blob.b1{width:520px;height:520px;background:#2bd0d4;top:-160px;left:-120px;animation:drift 14s ease-in-out infinite alternate}
.blob.b2{width:460px;height:460px;background:#f0a530;bottom:-200px;right:30%;opacity:.28;animation:drift 18s ease-in-out infinite alternate-reverse}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(circle at 30% 50%,#000,transparent 75%);-webkit-mask-image:radial-gradient(circle at 30% 50%,#000,transparent 75%)}
@keyframes drift{to{transform:translate(60px,40px) scale(1.1)}}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:7px 18px;font-size:19px;font-weight:500}
.chip .ico{color:var(--gold)}
.hero h1{font-size:150px;font-weight:800;line-height:1.05;margin:22px 0 14px}
.hero h1 span{background:linear-gradient(90deg,#ffd98a,#fff3d0,#ffd98a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.sub{font-size:28px;line-height:1.85;max-width:760px;opacity:.96}.sub b{color:var(--gold)}
.words{display:flex;gap:12px;margin-top:30px}
.words span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:9px 20px;font-weight:700;font-size:21px;animation:bob 4s ease-in-out infinite;animation-delay:calc(var(--k)*.4s)}
.words .ico{color:var(--gold)}
@keyframes bob{50%{transform:translateY(-6px)}}
.htop{display:flex;align-items:center;justify-content:space-between;position:relative}
.htop .bm b{color:#fff}.htop .bm small{color:rgba(255,255,255,.8)}
.htop .moe{border-color:var(--gold)}.htop .moe small{color:rgba(255,255,255,.75)}
/* device mock */
.dev{position:absolute;left:110px;top:210px;width:520px;height:420px;border-radius:30px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);padding:26px;box-shadow:0 40px 80px rgba(0,0,0,.25);transform:rotate(-4deg);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-4deg) translateY(-14px)}}
.dev .bar{display:flex;gap:8px;margin-bottom:24px}.dev .bar i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.45)}
.dev .row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.14);border-radius:16px;padding:14px;margin-bottom:12px}
.dev .row span{width:36px;height:36px;border-radius:12px;background:var(--gold)}.dev .row em{flex:1;height:12px;border-radius:9px;background:rgba(255,255,255,.4)}
.dev .row.r2 span{background:#7de3e6}.dev .row.r3 span{background:#fff}
.dev .row.r1 em{max-width:70%}.dev .row.r3 em{max-width:50%}
.dev .ch{display:flex;align-items:flex-end;gap:16px;height:110px;margin-top:20px;padding:0 10px}
.dev .ch i{flex:1;height:var(--h);border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#ffd98a,rgba(255,255,255,.35));animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{height:0}}
.fly{position:absolute;width:70px;height:70px;border-radius:22px;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:32px;box-shadow:0 18px 36px rgba(0,0,0,.2);animation:float2 6s ease-in-out infinite}
@keyframes float2{50%{transform:translateY(-16px) rotate(6deg)}}
/* slide-specific */
.what{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}
.what h2{font-size:64px;font-weight:800;margin:6px 0 18px}
.what p{font-size:26px;line-height:1.9;color:var(--ink2)}.what p b{color:var(--brand2)}
.eq{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:46px 30px}
.eqi{display:flex;flex-direction:column;align-items:center;gap:12px;width:130px;text-align:center}
.eqi i{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;background:var(--brandsoft);color:var(--brand);font-size:42px;box-shadow:inset 0 0 0 1px rgba(15,138,148,.2)}
.eqi b{font-size:20px}
.eqi.res i{background:var(--grad);color:#fff;box-shadow:0 14px 30px rgba(12,111,130,.3)}
.eqi.res b{color:var(--brand2);font-size:22px}
.eq em{font-style:normal;font-size:40px;font-weight:800;color:var(--acc);margin-bottom:34px}
.ps{display:flex;flex-direction:column;gap:16px}
.psh{display:grid;grid-template-columns:1fr 64px 1fr;font-weight:800;font-size:20px;margin-bottom:-4px}
.psh span:first-child{color:var(--bad)}.psh span:last-child{color:var(--ok)}
.pr{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center}
.pc{display:flex;gap:18px;align-items:center;padding:20px 24px}
.pc b{display:block;font-size:24px;margin-bottom:2px}.pc p{font-size:19px;color:var(--ink2);line-height:1.5}
.pc.p{background:#fdf3f4;border-color:#f6d9dd}.pc.p .ib{background:#fbe3e6;color:var(--bad)}
.pc.c{background:#eefaf4;border-color:#cdeedd}.pc.c .ib{background:#d9f3e6;color:var(--ok)}
.arr{display:grid;place-items:center;color:var(--brand);font-size:30px}
.vm{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.vc{position:relative;overflow:hidden;padding:36px 32px}
.vc::after{content:"";position:absolute;inset:auto -30% -60% auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(15,138,148,.12),transparent 70%)}
.vn{position:absolute;top:18px;left:24px;font-size:64px;font-weight:800;color:var(--brandsoft)}
.vc .ib{width:70px;height:70px;font-size:34px;background:var(--grad);color:#fff;margin-bottom:18px}
.vc b{font-size:32px;display:block;margin-bottom:10px}.vc p{font-size:22px;line-height:1.75;color:var(--ink2)}
.goals{display:flex;justify-content:center;gap:14px;margin-top:34px;flex-wrap:wrap}
.goals span{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:10px 20px;font-size:20px;font-weight:700;color:var(--brand2);box-shadow:var(--shadow)}
.goals .ico{font-size:22px;color:var(--acc)}
.flow{display:grid;grid-template-columns:520px 1fr;gap:70px;align-items:center}
.cyc{position:relative;width:500px;height:500px}
.cyc svg{width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke:rgba(15,138,148,.1);stroke-width:30}
.ring2{fill:none;stroke:rgba(15,138,148,.3);stroke-width:1.5;stroke-dasharray:4 7;transform-origin:200px 200px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.arc{fill:none;stroke:#0f8a94;stroke-width:3;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400}
.slide.on .arc{animation:draw 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d) + .4s)}
@keyframes draw{to{stroke-dashoffset:0}}
.core-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.core-t b{font-size:34px;font-weight:800}.core-t small{font-size:16px;opacity:.92;max-width:130px;line-height:1.5}
.node{position:absolute;transform:translate(-50%,-50%) scale(.6);opacity:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:130px;transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .5s;transition-delay:calc(var(--d) + .2s)}
.slide.on .node{transform:translate(-50%,-50%) scale(1);opacity:1}
.node i{width:70px;height:70px;border-radius:50%;background:#fff;border:3px solid var(--brand);display:grid;place-items:center;color:var(--brand);font-size:30px;box-shadow:0 10px 22px rgba(13,59,102,.15)}
.node b{font-size:19px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 12px;box-shadow:var(--shadow);white-space:nowrap}
.fl{list-style:none;display:flex;flex-direction:column;gap:14px}
.fl li{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 22px;box-shadow:var(--shadow)}
.fl li>span{flex:none;width:48px;height:48px;border-radius:15px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.fl b{font-size:25px;display:block}.fl p{font-size:19px;color:var(--ink2)}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.bt{padding:22px 24px;display:flex;flex-direction:column;gap:8px}.bth{display:flex;align-items:center;gap:14px}
.bt.w2{grid-column:span 2}
.bt .ib{width:50px;height:50px;font-size:25px}
.bt b{font-size:23px}.bt p{font-size:18px;color:var(--ink2);line-height:1.55}
.bt.acc{background:var(--grad);border-color:transparent;color:#fff}.bt.acc p{color:rgba(255,255,255,.9)}.bt.acc .ib{background:rgba(255,255,255,.18);color:#fff}
.who{display:grid;grid-template-columns:540px 1fr;gap:70px;align-items:center}
.hub{position:relative;width:520px;height:520px}
.hub svg{width:100%;height:100%}
.spoke{stroke:rgba(15,138,148,.35);stroke-width:2;stroke-dasharray:5 6}
.orb{fill:none;stroke:rgba(15,138,148,.18);stroke-width:2}.orb.o2{stroke-dasharray:3 6;transform-origin:200px 200px;animation:spin 50s linear infinite reverse}
.hubc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 18px 40px rgba(12,111,130,.35);font-size:38px}
.hubc b{font-size:20px}
.hn{position:absolute;transform:translate(-50%,-50%) scale(.6);opacity:0;display:flex;flex-direction:column;align-items:center;text-align:center;width:150px;transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .5s;transition-delay:var(--d)}
.slide.on .hn{transform:translate(-50%,-50%) scale(1);opacity:1}
.hn i{width:66px;height:66px;border-radius:20px;background:#fff;border:2px solid var(--brand);display:grid;place-items:center;color:var(--brand);font-size:28px;box-shadow:var(--shadow);margin-bottom:6px}
.hn b{font-size:18px;background:#fff;border-radius:99px;padding:0 8px}
.wl{list-style:none;display:flex;flex-direction:column;gap:14px}
.wl li{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 22px;box-shadow:var(--shadow)}
.wl li .ib{width:52px;height:52px;font-size:26px}
.wl b{font-size:25px;min-width:200px}.wl span{font-size:21px;color:var(--ink2)}
.ba{display:flex;flex-direction:column;gap:12px}
.bar2,.bah{display:grid;grid-template-columns:260px 1fr 56px 1fr;align-items:center;gap:0}
.bah{font-weight:800;font-size:21px;padding:0 6px 4px}
.bah .b{color:var(--bad);display:flex;align-items:center;gap:8px}.bah .a{color:var(--ok);display:flex;align-items:center;gap:8px}
.bar2>b{font-size:23px;color:var(--brand2);padding:0 18px}
.bar2 .b,.bar2 .a{font-size:21px;padding:18px 22px;border-radius:16px}
.bar2 .b{background:#fdf3f4;color:#8c3742;text-decoration:line-through;text-decoration-color:rgba(210,63,79,.35)}
.bar2 .a{background:#eefaf4;color:#17643f;font-weight:700}
.bar2{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:var(--shadow)}
.sw{display:grid;place-items:center;color:var(--brand);font-size:26px}
.jt{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.jc{display:flex;gap:18px;padding:28px 26px;align-items:flex-start}
.jc b{display:block;font-size:25px;margin-bottom:6px}.jc p{font-size:20px;line-height:1.65;color:var(--ink2)}
.jc:nth-child(odd) .ib{background:#fdf3e2;color:var(--acc2)}
.arch{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.wire{position:absolute;top:44px;left:10%;right:10%;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--brandsoft),var(--brand),var(--brandsoft))}
.wire i{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:pulse 3.9s linear infinite;animation-delay:var(--o,0s)}
@keyframes pulse{from{right:0}to{right:100%}}
.nd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.ndi{position:relative;width:92px;height:92px;border-radius:28px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:42px;box-shadow:0 14px 30px rgba(12,111,130,.3);margin-bottom:10px}
.ndi em{position:absolute;top:-8px;left:-8px;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-weight:800;font-size:17px;display:grid;place-items:center;border:3px solid var(--bg)}
.nd small{font-size:16px;font-weight:700;color:var(--acc2)}
.nd b{font-size:27px}.nd p{font-size:19px;color:var(--ink2);line-height:1.6;min-height:92px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.chips span{font-size:16px;font-weight:700;background:var(--brandsoft);color:var(--brand2);border-radius:99px;padding:4px 12px;direction:ltr}
.sec{display:flex;justify-content:center;gap:16px;margin-top:40px}
.sec span{display:inline-flex;align-items:center;gap:10px;background:var(--lab-navy);color:#fff;border-radius:99px;padding:12px 24px;font-size:20px;font-weight:700}
.sec .ico{color:#7de3e6;font-size:22px}
.faq{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fq{padding:22px 26px}
.fq b{display:flex;align-items:center;gap:12px;font-size:23px;margin-bottom:8px;color:var(--brand2)}
.fq b .ico{font-size:26px;color:var(--acc)}
.fq p{font-size:19px;line-height:1.7;color:var(--ink2)}
/* end */
.end{justify-content:center;align-items:center;text-align:center}
.end h2{font-size:84px;font-weight:800;margin:20px 0 12px;position:relative}
.end h2 span{color:var(--gold)}
.end .lead{font-size:28px;opacity:.95;position:relative}
.sig{display:flex;gap:24px;margin-top:50px;position:relative}
.sig>div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(8px);border-radius:24px;padding:24px 40px;min-width:380px;border-top:5px solid var(--gold)}
.sig small{display:block;font-size:17px;opacity:.8}.sig b{display:block;font-size:30px;margin:4px 0}.sig span{font-size:19px;opacity:.9}
.go{display:inline-flex;align-items:center;gap:10px;margin-top:40px;background:#fff;color:var(--brand2);font-weight:800;font-size:23px;padding:14px 30px;border-radius:16px;text-decoration:none;position:relative;box-shadow:0 14px 30px rgba(0,0,0,.2)}
.lab{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:14px;padding:12px 20px 12px 16px;border-radius:18px;background:var(--lab-navy);color:#fff;box-shadow:0 10px 24px rgba(16,44,59,.3)}
.lab svg{width:46px;height:46px}
.lab small{display:block;font-size:14px;color:#9fd3d1}.lab b{font-size:19px;font-weight:800;white-space:nowrap}
.ai{font-style:normal;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--lab-teal),var(--lab-blue) 60%,var(--lab-orange));padding:2px 7px;border-radius:6px;vertical-align:3px;margin-inline-start:4px}
.labm{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;border-radius:12px;background:var(--lab-navy);color:#fff;box-shadow:0 6px 14px rgba(16,44,59,.18)}
.labm svg{width:28px;height:28px}.labm small{display:block;font-size:11px;color:#9fd3d1;line-height:1.2}.labm b{display:block;font-size:13px;font-weight:800;white-space:nowrap;line-height:1.3}.labm .ai{font-size:10px;padding:1px 5px;vertical-align:1px}
.footl{display:flex;align-items:center;gap:18px}

/* ===== المحرك ===== */
const stage=document.getElementById('stage'),N=S.length;
stage.innerHTML=S.map((s,k)=>`<section class="slide ${s.cls||''}" id="sl${k}" aria-label="${s.title}" aria-hidden="true">${s.html}</section>`).join('');
const els=[...stage.children];els.forEach((e,k)=>{const p=e.querySelector('.pg');if(p)p.textContent=(k+1)+' / '+N});
document.getElementById('tocL').innerHTML=S.map((s,k)=>`<button type="button" data-go="${k}"><span>${k+1}</span>${s.title}</button>`).join('');
let cur=-1,step=0;
const STEPS=els.map(e=>[...e.querySelectorAll('.st')]);
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
function paintSteps(){const L=STEPS[cur];STEPS[cur].forEach((x,k)=>x.classList.toggle('in',k<step));
  document.getElementById('steps').innerHTML=L.length?L.map((_,k)=>`<i class="${k<step?'on':''}"></i>`).join(''):'';
  document.getElementById('steps').style.display=L.length&&L.length<=14?'flex':'none'}
function show(i,push,full){i=Math.max(0,Math.min(N-1,i));if(i===cur)return;
  if(cur>=0){els[cur].classList.remove('on');els[cur].setAttribute('aria-hidden','true')}
  cur=i;step=full?STEPS[i].length:0;const e=els[i];paintSteps();void e.offsetWidth;e.classList.add('on');e.setAttribute('aria-hidden','false');
  document.getElementById('cnt').textContent=(i+1)+' / '+N;
  document.querySelector('#prog span').style.width=((i+1)/N*100)+'%';
  document.querySelectorAll('#tocL button').forEach((b,k)=>b.classList.toggle('cur',k===i));
  if(push!==false){try{history.replaceState(null,'','#s'+(i+1))}catch(_){}}}
let hinted=false;
function next(){if(!hinted){hinted=true;document.getElementById('hint').classList.add('off')}
  if(step<STEPS[cur].length){step++;paintSteps()}else show(cur+1)}
function prev(){if(step>0){step--;paintSteps()}else if(cur>0)show(cur-1,true,true)}

document.getElementById('bNext').onclick=next;document.getElementById('bPrev').onclick=prev;
const toc=document.getElementById('toc');
document.getElementById('bToc').onclick=()=>toc.classList.add('open');
toc.onclick=e=>{const b=e.target.closest('[data-go]');if(b)show(+b.dataset.go);toc.classList.remove('open')};
document.getElementById('bFs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(_){}};
addEventListener('keydown',e=>{if(toc.classList.contains('open')){if(e.key==='Escape')toc.classList.remove('open');return}
  if(['ArrowLeft','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowRight','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(N-1);else if(e.key==='f'||e.key==='F')document.getElementById('bFs').click()});
document.getElementById('viewport').addEventListener('click',e=>{if(e.target.closest('a'))return;next()});
document.getElementById('viewport').addEventListener('contextmenu',e=>{e.preventDefault();prev()});
let tx=null,ty=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){dx>0?next():prev()}tx=null},{passive:true});
let it;const wake=()=>{document.body.classList.remove('idle');clearTimeout(it);it=setTimeout(()=>document.body.classList.add('idle'),3000)};addEventListener('mousemove',wake);addEventListener('touchstart',wake,{passive:true});wake();
const fromHash=()=>{const m=/^#s(\d+)$/.exec(location.hash);return m?+m[1]-1:0};
addEventListener('hashchange',()=>show(fromHash(),false));
addEventListener('resize',fit);fit();show(fromHash(),false);
</script>
